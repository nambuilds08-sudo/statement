/* VOICE: 하드보일드 사건 파일, 건조하고 단단한 밤의 톤
   IDEA: 경찰 사건 폴더 + 머그샷 촬영 벽
   PICTURE: 키 눈금 벽 앞의 픽셀 머그샷, 거짓말이 무너지면 붉은 도장이 찍힌다
   COLOUR and TYPE: 녹흑 취조실 + 바랜 서류 종이 + 도장 적색 / 갈무리 픽셀체(제목·UI) + 갈무리14(대사)
   LAYOUT: 상단 사건 바, 머그샷 탭, 좌 머그샷 · 우 진술 기록, 모바일은 대화가 화면 대부분 */

:root{color-scheme:dark;--bg:#0e1113;--bg2:#13171a;--panel:#181d20;--line:#2c3438;--ink:#ebe5d8;--mute:#8d9792;--paper:#e7dec9;--paper2:#d8ccb1;--pink:#26211a;--red:#d23c3c;--lamp:#f2dca4}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body,button,select{word-break:keep-all;overflow-wrap:anywhere}
body{font:15px/1.6 "G14","Apple SD Gothic Neo",sans-serif;overflow-x:clip;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(242,220,164,.10),transparent 70%),var(--bg)}
.px{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
h1,h2,b,.ui{font-family:"G11B","G14",sans-serif;font-weight:400}
h1,h2{margin:0;line-height:1.15}
button{font:13px/1 "G11B","G14",sans-serif;color:var(--ink);cursor:pointer;min-height:44px;padding:10px 14px;background:#232b2f;border:0;box-shadow:inset 0 -4px 0 #151a1d,inset 0 0 0 2px var(--line)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px 0 #151a1d,inset 0 0 0 2px var(--line)}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.red{background:var(--red);box-shadow:inset 0 -4px 0 #8f2424,inset 0 0 0 2px #e85a5a;color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(14px,3vw,32px) max(4vw,14px)}
.lbl{font:12px/1 "G11B",sans-serif;color:var(--mute);letter-spacing:.02em}
[hidden]{display:none!important}

/* 사건 폴더 표지 */
.cover{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:28px;align-items:stretch}
.folder{position:relative;background:var(--paper);color:var(--pink);padding:34px 28px 28px}
.folder .tabk{position:absolute;top:-1px;left:24px;background:var(--paper2);padding:6px 12px;font:12px/1 "G11B";transform:translateY(-100%)}
.folder h1{font-size:36px;margin:10px 0 16px;color:#1b1814}
.folder p{margin:0 0 12px}
.facts{margin:14px 0 22px;padding:12px 0;border-block:2px dashed #b9ab8c;display:grid;gap:6px}
.facts div{display:flex;gap:10px}.facts span{font:12px/1.9 "G11B";color:#7a6a4c;flex:none;width:6.5em}
.stamp0{position:absolute;right:20px;top:26px;border:3px solid var(--red);color:var(--red);font:20px/1 "G11B";padding:6px 10px;transform:rotate(8deg);opacity:.85}
.folder small{display:block;margin-top:14px;color:#7a6a4c;font-size:13px}
.lineup{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:40px 16px 0;min-height:360px;background:repeating-linear-gradient(to bottom,rgba(235,229,216,.16) 0 2px,transparent 2px 48px),linear-gradient(#1d2326,#121618)}
.lineup .one{width:30%;text-align:center}
.lineup svg{width:100%;display:block;image-rendering:pixelated}
.lineup .tag{display:block;background:#0a0c0d;font:12px/1 "G11B";padding:8px 4px;color:var(--ink)}

/* 수사 화면 */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar h1{font-size:24px;margin-right:auto}
.ammo{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:3px}.dots i{width:8px;height:12px;background:var(--lamp)}.dots i.off{background:#2a3134}
.cnt{font:13px/1 "G11B";white-space:nowrap}.cnt.low{color:var(--red)}
#left2{display:none}
.tabs{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto;padding:2px}
.tab{position:relative;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;flex:none}
.tab .th{width:40px;height:40px;background:#0f1315;display:block}.tab svg{width:40px;height:40px;display:block}
.tab.on{background:var(--ink);color:#151515;box-shadow:inset 0 -4px 0 #a9a293}
.mini{position:absolute;left:4px;bottom:4px;background:var(--red);color:#fff;font:10px/1 "G11B";padding:3px 4px;transform:rotate(-6deg)}
.room{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px}
.mug{align-self:start;position:relative;background:repeating-linear-gradient(to bottom,rgba(235,229,216,.18) 0 2px,transparent 2px 40px),radial-gradient(ellipse 70% 60% at 50% 0,rgba(242,220,164,.22),transparent 70%),linear-gradient(#20272a,#121618);padding:28px 0 0;overflow:hidden}
.mug svg{display:block;width:min(74%,300px);margin:0 auto;image-rendering:pixelated}
.ruler{position:absolute;left:10px;top:20px;display:grid;gap:22px;font:11px/1 "G11B";color:rgba(235,229,216,.45)}
.plate{background:#090b0c;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plate b{font-size:22px}.plate span{font-size:13px;color:var(--mute)}
.stamp{position:absolute;right:14px;top:16px;border:4px solid var(--red);color:var(--red);font:26px/1 "G11B";padding:8px 12px;transform:rotate(-10deg);background:rgba(14,17,19,.4)}
.stamp.go{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-10deg) scale(2.4);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
.shake{animation:shake .45s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media(prefers-reduced-motion:reduce){.stamp.go,.shake{animation:none}}
.side{display:flex;flex-direction:column;gap:10px}
.log{background:var(--bg2);box-shadow:inset 0 0 0 2px var(--line);padding:16px;height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.say{align-self:flex-start;max-width:90%;padding:10px 14px;background:var(--panel);box-shadow:inset 3px 0 0 var(--mute)}
 .case.paid .st{color:var(--red)}
.case.paid{opacity:.92}
.bpk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bpk button{display:flex;align-items:center;gap:4px;padding:6px 10px;font-size:13px;background:var(--paper2,#efe6d2);color:#2a2420;border:2px solid #b9a98a;box-shadow:none}
.bpk button svg{width:22px;height:22px}
.bpk button.on{background:#2a2420;color:#f4ecdb;border-color:#2a2420}
.bev{margin-top:6px;width:100%;text-align:left;padding:8px 10px;font-size:13px;background:#fbf6ea;color:#7a5a3a;border:2px dashed #b9a98a;box-shadow:none}
.bev.on{border-style:solid;color:#2a2420;background:#fff8e6}
.pick select.hid{display:none}
#evsheet{position:fixed;inset:0;z-index:96;background:rgba(8,8,10,.7);display:flex;align-items:flex-end}
#evsheet .sh{background:var(--paper);color:#2a2420;width:100%;max-height:72vh;overflow:auto;padding:14px 14px 22px}
#evsheet .sh b.t{display:block;font:15px/1.4 "G11B";margin-bottom:8px}
#evsheet .sh button.ev2{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 10px;background:#fbf6ea;color:#2a2420;border:2px solid #d8c9a8;box-shadow:none;font-size:13px;line-height:1.5}
#evsheet .sh button.ev2 small{display:block;color:#7a6a4c;font-size:12px}
#evsheet .sh .x{float:right;background:none;box-shadow:none;border:0;font-size:18px;color:#7a6a4c}
#title:not([hidden]){min-height:100vh;display:flex;}
#title{align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;background:radial-gradient(ellipse 70% 45% at 50% 30%,rgba(242,210,122,.10),transparent 70%)}
#title .tbox{position:relative;display:grid;gap:12px;justify-items:center;padding:0 24px 28px;width:100%;max-width:420px}
#title .lampwrap{position:relative;width:100%;height:96px;margin-bottom:-18px}
#title .lamp{position:absolute;left:50%;top:0;width:120px;height:90px;transform:translateX(-50%);z-index:2}
#title .cone{position:absolute;left:50%;top:64px;width:300px;height:250px;transform:translateX(-50%);background:linear-gradient(rgba(246,220,138,.30),rgba(246,220,138,.08) 60%,transparent);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);pointer-events:none;z-index:1;animation:flick 6s infinite}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
#title .logo{position:relative;z-index:2;display:flex;align-items:flex-start;gap:10px}
#title .lt{font:64px/1 "G11B";letter-spacing:.06em;color:#f4ecdb;text-shadow:4px 4px 0 var(--red)}

<script>window.SIM_LANG="ko";window.SIM_DEMO={"play": "", "x": "https://x.com/kyojutsu_game"};window.SIM_API="https://simmunsil-api.whdska0222.workers.dev";window.SIM_ADS={"rewardedId": "", "testing": true};window.SIM_LANGS=[["ko", "\ud55c\uad6d\uc5b4"], ["ja", "\u65e5\u672c\u8a9e"]];</script>
<script>
/* ===== 소리 (배경음 + 효과음) =====

   음악 파일 없이 Web Audio로 직접 만든다 (저작권 걱정 없음, 앱 용량 0).
   배경음: 부드러운 패드 + 현을 뜯는 듯한 선율(가야금·하프 느낌) + 낮은 베이스 + 잔향.
           선율은 매번 새로 지어서 같은 구간이 반복되지 않는다. 지치지 않게 쉼표를 넉넉히 둔다.
   분위기: title(타이틀·목록) · calm(심문) · tense(압박·거짓말 직전) · end(결과)
   효과음: 각진 전자음 대신 둥근 소리(사인·삼각파 + 저역 필터)로. */
const SND=(()=>{
  let AC=null,master,bgmBus,sfxBus,verb,warm,bgmOn=true,sfxOn=true,mood=null,timer=null,nextBar=0,bar=0,phrase={left:0,rest:0,idx:5},thinkIv=null,KS={},roomSrc=null,roomGain=null;
  try{bgmOn=localStorage.getItem('sim-bgm')!=='0';sfxOn=localStorage.getItem('sim-sfx')!=='0';if(localStorage.getItem('sim-mute')==='1'){bgmOn=false;sfxOn=false}}catch(e){}
  const BPM=64,BEAT=60/BPM,BARLEN=BEAT*4;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  /* A 단조 5음(라 도 레 미 솔) — 계면조 느낌 */
  const PENTA=[57,60,62,64,67,69,72,74,76,79,81];
  const PROG={
    title:[[45,[57,60,64,71]],[41,[53,57,60,64]],[48,[55,60,64,67]],[40,[52,55,59,62]]],
    calm:[[45,[57,60,64,71]],[41,[53,57,60,64]],[38,[50,53,57,64]],[40,[52,55,59,62]]],
    tense:[[45,[57,60,64]],[45,[57,60,63]],[41,[53,57,60]],[40,[52,56,59,62]]],
    end:[[41,[53,57,60,64]],[43,[55,59,62,67]],[45,[57,60,64,71]],[45,[57,60,64,69]]]
  };
  const MOOD={title:{mel:.42,low:0,pad:.022,cut:900,bass:.05,heart:0,tick:0},
    calm:{mel:.62,low:0,pad:.02,cut:1000,bass:.06,heart:0,tick:0},
    tense:{mel:.34,low:-12,pad:.024,cut:560,bass:.08,heart:1,tick:1},
    end:{mel:.4,low:0,pad:.024,cut:1200,bass:.05,heart:0,tick:0}};

  function init(){
    if(AC)return true;
    try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}
    master=AC.createGain();master.gain.value=.9;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-6;comp.knee.value=6;comp.ratio.value=4;comp.attack.value=.005;   /* 큰 소리만 살짝 눌러 주는 정도 */
    master.connect(comp).connect(AC.destination);
    warm=AC.createBiquadFilter();warm.type='lowpass';warm.frequency.value=3200;warm.Q.value=.4;warm.connect(master);
    verb=AC.createConvolver();verb.buffer=impulse(3.2);const vg=AC.createGain();vg.gain.value=.55;verb.connect(vg).connect(warm);
    bgmBus=AC.createGain();bgmBus.gain.value=bgmOn?1.1:0;bgmBus.connect(warm);
    sfxBus=AC.createGain();sfxBus.gain.value=sfxOn?.8:0;sfxBus.connect(warm);
    document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(bgmOn||sfxOn)AC.resume()});
    return true}
  function unlock(){if(!init())return;if(AC.state==='suspended')AC.resume();if(mood&&!timer)start()}
  function impulse(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}return b}
  /* 현을 뜯는 소리 (Karplus-Strong): 처음 잡음을 부드럽게 다듬어 맑지만 쨍하지 않게 */
  function ks(freq){const key=Math.round(freq*10);if(KS[key])return KS[key];
    const sr=AC.sampleRate,len=Math.floor(sr*1.7),N=Math.max(2,Math.round(sr/freq)),b=AC.createBuffer(1,len,sr),y=b.getChannelData(0);
    for(let i=0;i<N;i++)y[i]=Math.random()*2-1;
    for(let k=0;k<3;k++)for(let i=1;i<N;i++)y[i]=(y[i]+y[i-1])*.5;
    for(let i=N;i<len;i++)y[i]=.4968*(y[i-N]+y[i-N-1>=0?i-N-1:0]);
    for(let i=0;i<len;i++)y[i]*=.6*(i>len-2000?(len-i)/2000:1);
    return KS[key]=b}
  function pluck(m,t,v,bus,wet){const s=AC.createBufferSource();s.buffer=ks(hz(m));const g=AC.createGain();g.gain.value=v;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;s.connect(f).connect(g);g.connect(bus);
    const w=AC.createGain();w.gain.value=wet==null?.45:wet;g.connect(w).connect(verb);s.start(t);s.stop(t+1.7)}
  /* 부드러운 피아노 (배음을 하나씩 쌓고 높은 배음일수록 빨리 사라지게) — 눌렀다 자연스럽게 잦아든다 */
  const PN={};
  function pianoBuf(m){if(PN[m])return PN[m];const sr=AC.sampleRate,len=Math.floor(sr*3.2),b=AC.createBuffer(1,len,sr),y=b.getChannelData(0),f=hz(m);
    const parts=[[1,1,3.0],[2,.42,1.7],[3,.2,1.1],[4,.1,.8],[5,.05,.6],[6,.025,.45]];
    for(const [k,a,tau0] of parts){const fk=f*k*Math.sqrt(1+.0003*k*k);if(fk>5000)continue;const tau=tau0*Math.min(1.6,Math.pow(220/f,.35)),w=2*Math.PI*fk/sr,ph=Math.random()*6;
      for(let i=0;i<len;i++){const t=i/sr;y[i]+=a*Math.sin(w*i+ph)*Math.exp(-t/tau)*(t<.006?t/.006:1)}}
    for(let i=0;i<len;i++)y[i]*=.32*(i>len-3000?(len-i)/3000:1);
    return PN[m]=b}
  function piano(m,t,v,bus,wet){const s=AC.createBufferSource();s.buffer=pianoBuf(m);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;
    const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(bus);const w=AC.createGain();w.gain.value=wet==null?.5:wet;g.connect(w).connect(verb);s.start(t);s.stop(t+3.2)}
  /* 화음: 한 번에 누르지 않고 아래서부터 살짝 굴려서. 두 번째 마디엔 두세 음만 가볍게 */
  function chordRoll(notes,t,m,second){const v=m.pad*7,ns=second?notes.slice(1).filter((_,i)=>i%2===0):notes;
    ns.forEach((n,i)=>piano(n+(m.low<0?-12:0),t+i*(second?.32:.07)+(Math.random()*.02),v*(second?.7:1)*(.85+Math.random()*.2),bgmBus))}
  function bass(m,t,v){const o=AC.createOscillator();o.type='sine';o.frequency.value=hz(m);const g=AC.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.06);g.gain.exponentialRampToValueAtTime(v*.35,t+1.6);g.gain.exponentialRampToValueAtTime(.0001,t+BARLEN);
    o.connect(g).connect(bgmBus);o.start(t);o.stop(t+BARLEN+.1)}
  function heart(t,v){for(const [dt,a] of [[0,1],[.22,.65]]){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(64,t+dt);o.frequency.exponentialRampToValueAtTime(38,t+dt+.16);
    const g=AC.createGain();g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v*a,t+dt+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.22);o.connect(g).connect(bgmBus);o.start(t+dt);o.stop(t+dt+.25)}}
  function tick(t,v,bus){const n=AC.createBufferSource(),len=Math.floor(AC.sampleRate*.03),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);n.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=3;
    const g=AC.createGain();g.gain.value=v;n.connect(f).connect(g).connect(bus||bgmBus);n.start(t)}
  /* 방 안 공기 (아주 작은 갈색 잡음) */
  function room(on){if(on&&!roomSrc){const len=AC.sampleRate*4,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let l=0;
      for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
      roomSrc=AC.createBufferSource();roomSrc.buffer=b;roomSrc.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
      roomGain=AC.createGain();roomGain.gain.value=0;roomSrc.connect(f).connect(roomGain).connect(bgmBus);roomSrc.start();roomGain.gain.linearRampToValueAtTime(.05,AC.currentTime+3)}
    else if(!on&&roomSrc){const s=roomSrc,g=roomGain;g.gain.linearRampToValueAtTime(0,AC.currentTime+1.5);setTimeout(()=>{try{s.stop()}catch(e){}},1700);roomSrc=null}}

  /* 선율: 쉼표를 넉넉히 둔 짧은 악구. 화음이 바뀌는 첫 박엔 화음 음으로 */
  function melodyBar(t,chord,m,first){
    for(let b=0;b<4;b++){
      if(phrase.rest>0){phrase.rest-=.25;continue}
      if(phrase.left<=0){phrase.left=3+Math.floor(Math.random()*4);if(Math.random()<.35){phrase.rest=1+Math.floor(Math.random()*2);continue}}
      if(Math.random()>m.mel)continue;
      const r=Math.random();phrase.idx+=r<.3?0:r<.65?(Math.random()<.5?1:-1):(Math.random()<.5?2:-2);
      phrase.idx=Math.max(2,Math.min(9,phrase.idx));
      let note=PENTA[phrase.idx];
      if(first&&b===0){const tones=chord[1].map(n=>n%12);const near=PENTA.filter(p=>tones.includes(p%12));if(near.length){note=near.reduce((a,c)=>Math.abs(c-note)<Math.abs(a-note)?c:a);phrase.idx=PENTA.indexOf(note)}}
      note+=m.low;
      const at=t+b*BEAT+(Math.random()*.03-.015),v=.16+Math.random()*.09;
      if(Math.random()<.14){const gi=PENTA.indexOf(note-m.low);const g=gi>0?PENTA[gi-1]+m.low:note-2;pluck(g,at-.07,v*.45,bgmBus)}   /* 꾸밈음 */
      pluck(note,at,v,bgmBus);phrase.left--;
      if(Math.random()<.18&&b<3){pluck(note+(Math.random()<.5?-3:-5),at+BEAT/2,v*.6,bgmBus)}
    }}
  function schedule(){
    if(!AC||!mood)return;
    while(nextBar<AC.currentTime+1.2){
      const m=MOOD[mood],prog=PROG[mood],ci=Math.floor(bar/2)%prog.length,chord=prog[ci],first=bar%2===0,t=nextBar;
      chordRoll(chord[1],t,m,!first);
      bass(chord[0],t,m.bass);if(Math.random()<.35)bass(chord[0]+(Math.random()<.5?7:12),t+BEAT*2,m.bass*.5);
      melodyBar(t,chord,m,first);
      if(m.heart)for(let b=0;b<4;b++)heart(t+b*BEAT,.22);
      if(m.tick)for(let b=0;b<4;b++)tick(t+b*BEAT+BEAT/2,.05);
      nextBar+=BARLEN;bar++}}
  function bgm(next){
    if(next===mood)return;mood=next;
    if(!AC)return;
    if(!mood){room(false);clearInterval(timer);timer=null;return}
    if(!timer)start();else room(mood!=='title')}
  function start(){nextBar=AC.currentTime+.15;bar=0;phrase={left:0,rest:.5,idx:5};timer=setInterval(schedule,250);schedule();room(mood!=='title')}

  /* ===== 효과음 ===== */
  const sine=(f,d,v,t0,type,bus)=>{const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus||sfxBus);o.start(t);o.stop(t+d+.05);return o};
  const swoosh=(d,v,from,to)=>{const t=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
    f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+d);const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(sfxBus);s.start(t)};
  const boom=(v,t0)=>{const t=AC.currentTime+(t0||0),o=AC.createOscillator();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(34,t+.5);
    const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g).connect(sfxBus);const w=AC.createGain();w.gain.value=.4;g.connect(w).connect(verb);o.start(t);o.stop(t+.75)};
  const pl=(m,t0,v)=>pluck(m,AC.currentTime+(t0||0),v,sfxBus,.5);
  const FX={
    blip:p=>sine(p||520,.035,.07,0,'sine'),   /* 글자 타자음: 아주 작고 둥글게 */
    click:()=>{sine(420,.05,.08,0,'triangle');tick(AC.currentTime,.08,sfxBus)},
    present:()=>{swoosh(.35,.5,600,2400);boom(.22,.12)},   /* 증거 내밀기: 휙 + 쿵 */
    gain:()=>{pl(69,0,.32);pl(76,.11,.3);pl(81,.22,.26)},   /* 증거 획득: 맑게 세 음 */
    stamp:()=>{boom(.4);tick(AC.currentTime,.18,sfxBus)},
    lie:()=>{boom(.55);swoosh(.9,.35,3000,300);pl(64,.25,.35);pl(63,.45,.3);pl(57,.7,.32)},   /* 거짓말 붕괴 */
    confess:()=>{pl(57,0,.3);pl(60,.35,.28);pl(64,.7,.28);pl(65,1.05,.3);pl(64,1.6,.32)},
    grade:g=>{const up=g==='S'?[69,72,76,81,84]:g==='A'?[69,72,76,81]:g==='B'?[69,72,76]:[69,67,64];up.forEach((n,i)=>pl(n,i*.13,.3))},
    page:()=>swoosh(.25,.25,1800,700)
  };
  function sfx(name,arg){if(!sfxOn||!init())return;if(AC.state==='suspended')AC.resume();try{FX[name]&&FX[name](arg)}catch(e){}}
  /* AI가 생각하는 동안 작게 째깍 */
  function think(on){if(thinkIv){clearInterval(thinkIv);thinkIv=null}

/* ===== 소리 ===== (sound.js 의 SND: 배경음 + 효과음) */
const audio=()=>SND.unlock();
const SFX={blip:k=>SND.sfx('blip',(LOOK[k]&&LOOK[k].pitch)||500),click:()=>SND.sfx('click'),present:()=>SND.sfx('present'),
  stamp:()=>SND.sfx('stamp'),gain:()=>SND.sfx('gain'),lie:()=>SND.sfx('lie'),confess:()=>SND.sfx('confess'),grade:g=>SND.sfx('grade',g),page:()=>SND.sfx('page')};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sndIcon=()=>{const off=!SND.bgmOn&&!SND.sfxOn;$('#snd').innerHTML=`<svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 4h2l3-3v8L3 6H1z" fill="currentColor"/>${off?'<path d="M7 3l3 4M10 3L7 7" stroke="currentColor" stroke-width="1.2"/>':'<path d="M7 3v4M9 2v6" stroke="currentColor"/>'}</svg>`;$('#snd').setAttribute('aria-label','소리 설정')};
/* 소리 설정: 배경음·효과음을 따로 켜고 끈다 */
function soundMenu(){if(document.getElementById('sndPick'))return;const box=document.createElement('div');box.id='sndPick';
  const row=()=>`<button class="px${SND.bgmOn?' on':''}" data-k="bgm">♪ 배경음 <b>${SND.bgmOn?'ON':'OFF'}</b></button><button class="px${SND.sfxOn?' on':''}" data-k="sfx">◆ 효과음 <b>${SND.sfxOn?'ON':'OFF'}</b></button><button class="px close">✕</button>`;
  box.innerHTML=`<div class="pw px">${row()}</div>`;document.body.appendChild(box);
  box.onclick=e=>{const b=e.target.closest('[data-k]');if(b){audio();if(b.dataset.k==='bgm')SND.setBgm(!SND.bgmOn);else SND.setSfx(!SND.sfxOn);box.firstChild.innerHTML=row();sndIcon();SFX.click();return}
    if(e.target.closest('.close')||e.target===box)box.remove()}}
/* 화면마다 배경음 분위기 */
const MOODS={'#title':'title','#season':'title','#inter':'title','#files':'title','#intro':'title','#game':'calm','#acc':'calm','#res':'end'};

/* ===== 타자 효과 ===== */
let TY=null,cutDelay=0;
function finishTyping(){if(!TY)return;clearTimeout(TY.t);clearInterval(TY.iv);TY.el.textContent=TY.full;TY.el.classList.remove('typing');TY.after.forEach(x=>x.hidden=false);const cb=TY.done;TY=null;$('#log').scrollTop=1e6;cb&&cb()}
function typeLine(el,after,who,done){const full=el.textContent;el.textContent='';after.forEach(x=>x.hidden=true);
  TY={el,full,after,done,i:0};const go=()=>{el.classList.add('typing');TY.iv=setInterval(()=>{if(!TY)return;TY.i++;el.textContent=full.slice(0,TY.i);if(TY.i%2)SFX.blip(who);$('#log').scrollTop=1e6;if(TY.i>=full.length)finishTyping()},26)};
  TY.t=setTimeout(go,cutDelay);cutDelay=0}
function cutin(t){const c=$('#cut');$('#cutTxt').textContent=t;c.classList.remove('on');void c.offsetWidth;c.classList.add('on');SFX.present();buzz(20);cutDelay=650}
const show=id=>{finishTyping();for(const x of ['#title','#season','#inter','#files','#intro','#game','#acc','#res'])$(x).hidden=x!==id;try{SND.bgm(MOODS[id]||null)}catch(err){}const e=$(id);e.classList.remove('enter');void e.offsetWidth;e.classList.add("enter");try{window.scrollTo(0,0)}catch(err){};if(typeof tutTick==='function')tutTick();if(typeof decorateSeason==='function')decorateSeason()};

/* ===== 상태 ===== */
let st,mode='q';
const ids=()=>C.order;
const per=v=>Object.fromEntries(ids().map(k=>[k,typeof v==='function'?v(k):JSON.parse(JSON.stringify(v))]));
const reset=()=>{st={left:C.max,cur:ids()[0],ex:per('normal'),have:[...C.start],fresh:{},flags:{},asked:{},shown:{},cf:{},log:per([]),seen:per(0),
  trust:per(k=>S[k].trust??2),press:per(0),shut:{},tone:'polite',hints:0,lastHint:'',hit:false}};
const has=k=>st.have.includes(k);
const lieOf=id=>Object.keys(C.lies).filter(l=>C.lies[l].who===id);
const broken=id=>AI()?!!(st.aiBroken||{})[id]:lieOf(id).some(l=>st.flags[l]);
const intact=id=>lieOf(id).some(l=>!st.flags[l]);
const say=(who,t,c)=>st.log[st.cur].push({who,t,c});
const gain=k=>{if(Array.isArray(k))return k.forEach(gain);if(!has(k)){st.have.push(k);st.fresh[k]=1;st.gainS=1;say('sys',`새 증거 확보 · <em>${EV[k].n}</em>`)}};
const spend=()=>{st.left--;st.hit=false};
const clamp5=v=>Math.max(0,Math.min(5,v));
function shutCheck(id){const P2=S[id].shut;if(P2&&intact(id)&&st.press[id]>=P2.at&&!st.shut[id]){st.shut[id]=1;st.press[id]=1;say('ptn',P2.warn)}}
function toneEffect(id,pressed){if(pressed){st.press[id]=clamp5(st.press[id]+1);st.trust[id]=clamp5(st.trust[id]-1)}else st.trust[id]=clamp5(st.trust[id]+1);shutCheck(id)}
function breakLie(l,how){st.flags[l]=1;st.hit=true;say('sys',`<em>${how==='cf'?'대질로 ':''}거짓말이 무너졌다</em>${C.lies[l].label?` · ${C.lies[l].label}`:''}`);if(C.pl&&C.pl[l])say('ptn',C.pl[l])}
const shutReply=(note)=>{st.shut[st.cur]=0;st.ex[st.cur]='angry';say('note',note);say('say',S[st.cur].shut.line);render()};

function ask(q){if(st.left<=0)return;finishTyping();SFX.click();spend();const pressed=st.tone==='press',txt=pressed&&q.qp?q.qp:q.q;
  if(st.shut[st.cur]){if(!pressed)st.trust[st.cur]=clamp5(st.trust[st.cur]+1);return shutReply(txt)}
  st.ex[st.cur]=q.ex||(pressed?'tense':'normal');st.asked[st.cur+q.id]=1;say('note',txt);
  const after=q.b&&st.flags[q.bf];say('say',after?q.b:q.a);
  if(q.gain&&(!q.gainIf||st.flags[q.gainIf]))gain(q.gain);
  if(q.brk&&!st.flags[q.brk])breakLie(q.brk);
  toneEffect(st.cur,pressed);render()}
function present(k){if(AI())return aiSend('',k);if(st.left<=0)return;finishTyping();spend();st.press[st.cur]=clamp5(st.press[st.cur]+1);const s=S[st.cur],p=s.pr[k];delete st.fresh[k];cutin(`「${EV[k].n}」 이건 어떻게 설명하죠?`);
  const note=`「${EV[k].n}」을(를) 내민다.`;
  if(st.shut[st.cur])return shutReply(note);
  if(p&&p.brk&&!st.flags[p.brk]){
    if(p.need&&!st.asked[st.cur+p.need]){st.ex[st.cur]='normal';say('note',note);say('say',p.early||s.def);say('ptn','앗, 선배… 아직 그 사람 진술을 안 들었잖아요. 먼저 <em>거짓말을 하게</em> 만들어야 증거가 먹혀요!');shutCheck(st.cur);render();return}
    if(p.req&&!st.flags[p.req]){st.ex[st.cur]='tense';say('note',note);say('say',p.early2||p.early||s.def);say('ptn',p.reqHint||'아직 이 증거를 들이밀 단계가 아닌 것 같아요. 다른 거짓말부터 무너뜨려 봐요.');shutCheck(st.cur);render();return}}
  st.shown[st.cur+k]=1;const live=p&&p.brk&&!st.flags[p.brk];
  st.ex[st.cur]=p?(live?'shock':(p.ex||'normal')):'normal';say('note',note);
  if(p){const line=p.brk&&!live&&p.done?p.done:p.a;say('say',line,live?'brk':'');if(live)breakLie(p.brk);if(p.gain&&(live||!p.brk))gain(p.gain)}else say('say',s.def);
  shutCheck(st.cur);render()}
const cf=(id,t)=>`<div class="ptn cfm px">${sil(id,'tense')}<p><b>${nm(id)} · 대질</b>${t}</p></div>`;
function confState(o){const key=st.cur+'<-'+o,c=(C.conf||{})[key];

async function aiFinal(){const B=st.aiBoard,rows=[...B.timeline,...B.final],N=rows.length;
  const ans=rows.map((r,i)=>({answer:$('#a-'+i).value,evidence:$('#e-'+i).value}));
  if(ans.some(a=>a.answer==='')){$('#accMsg').textContent='모든 칸에 답을 골라야 한다. 근거는 비워 둘 수 있지만 감점된다.';return}
  $('#accMsg').textContent='채점 중…';const r=await post('/api/board',{sessionId:st.sid,deviceId,answers:ans.map((a,i)=>({answer:rows[i].options?Number(a.answer):a.answer,evidence:a.evidence}))});
  if(!r.grade){$('#accMsg').textContent='채점 서버에 연결하지 못했어요. 다시 눌러 주세요.';return}
  const g=r.grade,ok=r.correct,eok=r.evidenceCorrect,cul=r.rows[B.timeline.length].ok;
  $('#grade').textContent=g;
  $('#resTitle').textContent=ok===N?(eok>=N-1?'완벽한 재구성':eok>=1?'진상에 도달했다':'답은 맞았지만, 근거가 하나도 없다'):cul?(C.finale?'학은 잡았지만, 전모는 놓쳤다':'범인은 맞혔지만, 전모는 놓쳤다'):(C.finale?'학은 다시 날아갔다':'엉뚱한 사람이 수갑을 찼다');
  $('#resScore').textContent=`추리 ${ok}/${N} · 근거 ${eok}/${N} · 남은 질문 ${st.left}`;
  $('#checks').innerHTML=r.rows.map((x,i)=>`<li><i class="${x.ok?'ok':'ng'}">${x.ok?(x.evidenceOk?'정답+근거':'정답'):'오답'}</i><span>${rows[i].time} · ${rows[i].q}</span></li>`).join('');
  $('#resPtn').innerHTML=sil('seoa',g==='S'||g==='A'?'normal':'tense')+`<p><b>${PT.name}</b>${(C.resLines||{})[g]||(g==='S'?'선배, 완벽해요! 근거까지 전부 맞았어요.':g==='A'?'범인은 확실해요. 다만 근거가 몇 개 빠졌어요.':g==='B'?'뭔가 놓친 게 있어요.':'선배… 이번엔 완전히 헛짚었어요.')}</p>`;
  $('#resTruth').innerHTML=C.truth;clearRun();
  const rank={S:4,A:3,B:2,C:1};if(!SAVE.grades[C.id]||rank[g]>rank[SAVE.grades[C.id]])SAVE.grades[C.id]=g;pendingInter=null;
  if(g!=='C'){if(C.finale){if(!SAVE.ended){SAVE.ended=1;pendingInter=C.id}}else if(!SAVE.cranes.includes(C.id)){SAVE.cranes.push(C.id);pendingInter=C.id}}store();
  lastRes={no:C.no,case:C.title,finale:!!C.finale,g,ok,eok,broke:Object.keys(st.aiBroken).length,lies:Object.keys(C.lies).length,left:st.left,hints:0,title:$('#resTitle').textContent,cells:r.rows.map(x=>x.ok?(x.evidenceOk?2:1):0)};
  $('#toSeason').textContent=pendingInter?'다음으로':'시즌으로';show('#res');setTimeout(()=>{SFX.stamp();buzz(40)},250);setTimeout(()=>SFX.grade(g),900)}

/* ===== 튜토리얼: 처음 하는 사람에게 그 순간에 맞는 안내를 한 번씩만 =====
   문구는 TUTX (proto/tutorial_text.js · proto/ja/tutorial_text.js). 여기에는 언어별 글자를 두지 않는다 */
const TUT_KEY='sim-tut';
let TUT=(()=>{try{return JSON.parse(localStorage.getItem(TUT_KEY)||'null')||{done:[],off:0}}catch(e){return {done:[],off:0}}})();
const tutSave=()=>{try{localStorage.setItem(TUT_KEY,JSON.stringify(TUT))}catch(e){}};
const tutDone=k=>TUT.done.includes(k);
const vis=sel=>{const e=$(sel);return !!e&&!e.hidden&&e.offsetParent!==null};
const answered=()=>st&&C?C.max-st.left:0;
const anyBroken=()=>!!st&&ids().some(k=>broken(k));
/* 정해진 대사 모드: 증거로 깰 수 있는 거짓 진술을 이미 들었는데 아직 안 깼는가 */
const heardLie=()=>{if(!st)return false;if(AI())return answered()>=3;
  return ids().some(k=>Object.values(S[k].pr||{}).some(p=>p&&p.brk&&p.need&&st.asked[k+p.need]&&!st.flags[p.brk]))};
/* 순서대로 검사해 조건이 맞는 첫 단계 하나만 보여 준다 */
const TUT_STEPS=[
  {k:'left',on:()=>vis('#game')&&answered()===0,el:'.ammo',chain:1},
  {k:'ask',on:()=>vis('#game')&&answered()===0&&mode==='q',el:'#choices',ai:true},
  {k:'lie',on:()=>vis('#game')&&heardLie()&&!anyBroken()&&mode!=='e',el:'#me'},
  {k:'tabs',on:()=>vis('#game')&&answered()>=1,el:'#tabs'},
  {k:'gauge',on:()=>vis('#game')&&answered()>=2,el:'#pic .gauge'},
  {k:'ev',on:()=>vis('#game')&&mode==='e',el:'#choices'},
  {k:'broke',on:()=>vis('#game')&&anyBroken(),el:'#mf'},
  {k:'conf',on:()=>vis('#game')&&mode==='c',el:'#choices'},
  {k:'hint',on:()=>vis('#game')&&!AI()&&answered()>=5&&!anyBroken(),el:'#hint'},
  {k:'acc',on:()=>vis('#game')&&(st.left<=Math.ceil(C.max/3)||ids().filter(k=>broken(k)).length>=2),el:'#toAcc'},
  {k:'board',on:()=>vis('#acc'),el:'#acc .brow'},
];
let tutT=null,tutOpen=false,tutSig='',tutChain=0;
/* 한 번의 행동(질문·탭 전환·화면 전환) 뒤에는 안내를 하나만 띄운다 */
const sigNow=()=>[answered(),mode,vis('#acc')?'acc':vis('#game')?'game':'x'].join('|');
function tutTick(){clearTimeout(tutT);tutT=setTimeout(tutCheck,120)}
function tutCheck(){if(TUT.off||tutOpen||!C)return;if(typeof TY!=='undefined'&&TY){tutTick();return}
  const s=TUT_STEPS.find(x=>!tutDone(x.k)&&(()=>{try{return x.on()}catch(e){return false}})());
  if(!s)return;if(sigNow()===tutSig&&!tutChain)return;tutChain=0;tutShow(s)}
function tutShow(s){const el=document.querySelector(s.el);if(!el||!el.getClientRects().length){TUT.done.push(s.k);tutSave();return tutTick()}
  tutOpen=true;try{el.scrollIntoView({block:'nearest'})}catch(e){}
  const r=el.getBoundingClientRect(),pad=6,W=window.innerWidth,H=window.innerHeight;
  const txt=(AI()&&TUTX[s.k+'_ai'])||TUTX[s.k];
  const below=r.top+r.height/2<H*0.5;  /* 아래쪽 대상이면 말풍선을 화면 맨 위로: 방금 나온 대사를 가리지 않게 */
  const box=document.createElement('div');box.id='coach';
  box.innerHTML=`<div class="hole" style="left:${Math.max(4,r.left-pad)}px;top:${Math.max(4,r.top-pad)}px;width:${Math.min(W-8,r.width+pad*2)}px;height:${Math.min(H-8,r.height+pad*2)}px"></div>
  <div class="bub px" style="${below?`top:${Math.min(H-190,r.bottom+pad+10)}px`:'top:10px'}">${sil('seoa','normal')}<p><b>${PT.name}</b>${txt}</p>
  <div class="row"><button class="px off">${TUTX.off}</button><button class="red px ok">${TUTX.ok}</button></div></div>`;
  document.body.appendChild(box);SFX.click();
  tutSig=sigNow();const close=all=>{box.remove();tutOpen=false;tutChain=s.chain||0;TUT.done.push(s.k);if(all)TUT.off=1;tutSave();tutTick()};
  box.querySelector('.ok').onclick=e=>{e.stopPropagation();close(false)};
  box.querySelector('.off').onclick=e=>{e.stopPropagation();close(true)};
  box.onclick=()=>close(false)}
function tutReset(){TUT={done:[],off:0};tutSave()}

truth:'<p>범인은 조합 이사 박성호. 주민 동의서 열한 장을 위조했고, 조합장이 그걸 알아채 다음 날 총회에서 폭로하려 하자 21시 40분 사무실로 돌아갔다. 22시 5분 공로패로 조합장을 친 뒤 금고를 열어 강도처럼 꾸미고, 동의서 원본 파일철을 챙겨 22시 15분 뒷계단으로 빠져나갔다.</p><p>류태건은 뇌물 봉투를, 최영숙은 무허가 전단을, 한동수는 근무 중 음주를, 김미란은 법인카드 사적 사용을 숨기려고 거짓말을 했다.</p>',

files:{kim:'조합 법인카드로 개인 물건을 몇 번 샀다. 22:20 그 내역 파일을 지우러 왔다가 잠긴 문 앞에서 돌아갔다. 동의서 필체가 이상하다는 건 진작 눈치챘다.',
  ryu:'21:30 조합장에게 시공사 돈 봉투를 건넸다. 살인과는 무관하지만 비리가 드러날까 봐 방문 자체를 숨겼다.',

story:'강원도 산골 온천 여관 설향각. 구독자 100만 버튜버 「리코」의 목소리 주인 이세린(24)이 별관 방에서 숨진 채 발견됐다. 방송은 밤 10시까지 이어졌고, 채팅창은 "끝무렵 화면에 유령이 비쳤다"며 들끓었다.',
facts:[['발견','22시 30분, 매니저가 별관 방에서'],['경찰 판단','사망 시각은 방송 종료 직후'],['흉기','세린이 방송 때 늘 두르던 목도리'],['용의자','5명. 모두 방송 시간의 행적을 숨긴다'],['수사 시작','이튿날 아침. 밤사이 눈은 그쳤고 현장은 보존됐다']],

truth:'<p>범인은 방송 기술 담당 강민재. 2년간 수익을 빼돌렸고, 세린이 독립을 준비하며 정산을 문제 삼자 범행을 결심했다. 21시 31분 전날 저녁 리허설 때 녹화해 둔 30분짜리 클립으로 송출을 바꾸고, 지붕 있는 복도로 별관에 가 21시 33분 목도리로 세린을 살해했다. 방송은 10시까지 이어진 것처럼 보였다.</p><p>녹화 클립 속 창밖엔 눈이 없었고, 22시 종소리도 없었다. "유령"은 클립 끝부분의 녹화 손상이었다. 정다솔은 다른 소속사와의 접촉을, 윤하늘은 방송 중 노천탕에 간 것을, 문옥자는 금지된 열쇠 대여를, 배준혁은 창밖까지 간 것을 숨겼다.</p>',
inter:{lines:['송출실 키보드 밑에서 나왔어요, 선배.','…또 종이학. 이번엔 세린 씨가 변호사한테 정산 내역을 넘긴다는 걸 알려 줬어요.','세 번째예요. 범인들은 서로 몰라요. 근데 종이학을 보낸 사람은… 셋 다 알고 있었어요.'],ex:['normal','tense','tense'],where:'송출실 키보드 밑',note:'세린은 이번 여행에서 정산 내역을 변호사에게 넘긴다.'},
files:{jung:'세린의 독립을 막으려고 다른 소속사와 몰래 접촉했다. 21:40 사과하러 방에 갔지만 대답이 없었다. 지금도 그 노크를 후회한다.',
  yoon:'"이제 시청하겠다"며 방송에서 나간 뒤 몰래 노천탕에 갔다. 그 덕분에 진짜 눈이 내리기 시작한 시각을 아는 유일한 증인이 됐다.',
  moon:'단골 배준혁에게 출입 금지인 별관 열쇠를 몰래 빌려줬다. 40년 동안 정시마다 친 종이 결정적 증거가 됐다.',
  bae:'리코를 가까이서 보고 싶어 별관 창밖까지 갔다. 팬레터는 정말 그가 쓴 게 아니었다. 아카이브를 수십 번 돌려 본 집념이 범인을 잡았다.',
  kang:'2년간 수익을 빼돌렸다. 종이학 쪽지로 세린이 정산 내역을 변호사에게 넘긴다는 걸 알고, 리허설 클립으로 알리바이를 만들었다.'}

story:'역세권 오피스텔 1407호, 인기 웹툰 작가 「모모」의 작업실. 마감 전날 밤 10시 10분, 저녁 약속에서 돌아온 모모는 완성 원고가 든 태블릿과 백업 외장하드가 함께 사라진 걸 발견했다. 문을 억지로 연 흔적은 없다.',
facts:[['발견','22시 10분, 작가 본인이 귀가 후'],['사라진 것','태블릿과 백업 외장하드. 지갑과 모니터는 그대로'],['출입','도어락. 억지로 연 흔적 없음'],['마감','다음 날 오전 10시']],

sceneAlt:'밤의 오피스텔, 14층 한 창문에만 불이 켜져 있다',sceneCap:'현장 사진 · 1407호 22:15',

ev:{'crane-1':{n:'첫 번째 종이학',d:'#001 박정호의 앞치마. "내일 아침 경찰이 온다. 장부를 정리할 시간은 오늘 밤뿐." 펼치면 옛 양식 번호 일부가 남은 누런 정사각형. 네 학 모두 같은 종이.'},
  'crane-2':{n:'두 번째 종이학',d:'#002 박성호의 차. "조합장은 내일 총회에서 동의서 원본을 꺼낸다."'},
  'crane-3':{n:'세 번째 종이학',d:'#003 송출실 키보드 밑. "세린은 이번 여행에서 정산 내역을 변호사에게 넘긴다."'},
  'crane-4':{n:'네 번째 종이학',d:'#004 채도윤의 가방. "실수는 사라지지 않는다. 사라지는 건 물건뿐이다." 유일하게 정보가 아니라 부추기는 말.'},
  'crane-5':{n:'다섯 번째 종이학',d:'반장실 책상 위. 아직 펼치지 않았다. 날개 안쪽에 "서아에게"라고 적혀 있다.'},
  invite:{n:'초대장',d:'"심문실에서 만나지. 이번엔 내가 용의자다." 종이학과 같은 누런 종이, 오른쪽 위 귀퉁이에 옛 양식 번호.'},
  badge:{n:'현직 반원 출입증',d:'현관 신발장 위. 특수심문반 출입증, 이름 칸이 테이프로 가려져 있다.'},
  'old-forms':{n:'옛 조서 용지 묶음',d:'서재 책장 아래 칸. 7년 전 폐기된 양식. 귀퉁이를 잘라 낸 장이 여럿이고, 펼친 종이학을 대면 절단면이 맞아떨어진다.'},
  'consult-log':{n:'주민센터 상담 일지',d:'백도겸의 무료 생활 상담 봉사 기록. 지난 1년 사이 강도윤, 오세창, 이세린, 모모가 상담을 받았다.'},
  scrapbook:{n:'사건 스크랩북',d:'네 사건의 신문 기사. 기사마다 범인 이름에 빨간 동그라미.'},
  creed:{n:'백도겸의 진술',d:'"사람은 등을 떠밀릴 때 본성을 드러낸다. 나는 밀었고, 넷째는 결과까지 골랐다."'},
  'crane-5-note':{n:'다섯 번째 쪽지',d:'"서아에게. 네 선배를 특수심문반에 추천한 건 나다. 넷째 사건은 네 선배를 위한 시험이었다."'}},
sus:{
  baek:{name:'백도겸',role:'초대 반장(은퇴) · 64세',def:'흠. 질문이 흐릿하군. 다시 해 보게.',trust:1,first:'"앉게. 오늘은 자네가 묻고, 내가 답하지."',
    look:{h:'#d8d4cc',c:'#4a3f35',C:'#3a3129',hair:'bald',brow:'#bdb7ad',glasses:'#c9a24a',deco:[[13,19,6,1,'#bdb7ad'],[13,24,6,2,'#e9e3d6'],[11,26,2,6,'#3a3129'],[19,26,2,6,'#3a3129']],pitch:260},
    qs:[{id:'p',q:'이 종이학, 반장님이 접으셨습니까?',qp:'종이학, 당신이 접었죠?',a:'종이접기라. 나는 그런 손재주가 없네. 서아가 학교 다닐 때도 내가 학 하나 못 접는다고 놀렸지.',bf:'baek-paper',b:'내가 접었네. 손재주가 없다는 건 거짓말이었지. 서아가 알았으면 서운했겠군.'},
      {id:'s',trust:3,q:'서재를 좀 둘러봐도 되겠습니까?',a:'예의 바르군. 마음대로 보게. 숨길 건 없으니. (책장 아래 칸에 누런 종이 묶음이 보인다)',gain:'old-forms'},
      {id:'r',q:'은퇴하고 어떻게 지내셨습니까?',qp:'은퇴하고 뭐 하고 살았어요?',a:'주민센터에서 무료 생활 상담을 했네. 늙은 형사가 할 일이라곤 남의 고민 들어 주는 것뿐이더군.'},
      {id:'g',reqAsk:'baekr',q:'그 상담 기록, 보여 주실 수 있습니까?',qp:'상담 일지 내놓으세요.',a:'봉사 기록이니 공개된 거나 마찬가지지. 여기 있네. (일지를 건넨다)',gain:'consult-log'},
      {id:'m',q:'네 사건 관계자를 만나신 적 있습니까?',qp:'피해자들, 다 만났었죠?',a:'신문에서 이름을 봤을 뿐이네. 피해자도, 범인도 나는 만난 적이 없어.',bf:'baek-strangers',b:'피해자들은 내 상담실에 왔었지. 다들 누군가를 고발할지 고민하고 있었어.'},
      {id:'k',press:3,ex:'normal',q:'이 사건들, 계속 지켜보고 계셨죠?',qp:'신문 기사, 다 모아 뒀죠?',a:'좋은 눈빛이군. 그래, 모아 뒀네. 보여 주지. (스크랩북을 꺼낸다)',gain:'scrapbook'},
      {id:'h',req:'baek-strangers',q:'왜 범인들에게 비밀을 흘리셨습니까?',qp:'왜 그 사람들 등을 떠밀었어요?',a:'나는 아무도 해치지 않았네. 정보를 건넸을 뿐이야. 장부를 태울지, 공로패를 들지, 선택은 전부 그들이 했지.',bf:'baek-hands',b:'사람은 등을 떠밀릴 때 본성을 드러내지. 나는 밀기만 했고, 결과까지 골랐어. 넷째는 특히.'},
      {id:'f',req:'baek-hands',q:'다섯 번째 학을 펼쳐도 됩니까?',qp:'다섯 번째 학, 지금 펼칩니다.',a:'…그건 서아한테 쓴 거네. 서아가 직접 펼치게 해 주게. (한서아가 떨리는 손으로 종이학을 펼친다)',gain:'crane-5-note'},
      {id:'y',req:'baek-hands',q:'왜 하필 저를 부르셨습니까?',qp:'왜 나를 불렀어요?',a:'자네가 네 사건을 다 풀었으니까. 그뿐이야. 우연이지.'},
      {id:'t',trust:4,q:'서아 형사를 가르치실 때, 어떤 분이셨습니까?',a:'…착한 아이였지. 거짓말을 하면 귀가 빨개졌어. 지금도 그렇군. (한서아가 고개를 돌린다)'}],
    pr:{'old-forms':{need:'p',early:'7년 전 양식이군. 은퇴할 때 가져온 기념품이네. 그게 왜?',brk:'baek-paper',a:'…귀퉁이를 잘라 낸 장이라. 자네, 서재를 꼼꼼히도 봤군. 그래, 그 학들은 내가 접었네. 이 종이로.'},
      invite:{need:'p',early:'초대장은 내가 썼지. 그런데 그게 학을 접었다는 증거는 아니잖나.',a:'그래, 같은 종이야. 하지만 종이가 같다고 손이 같은 건 아니지. 그 종이가 어디서 왔는지 보여 주게.'},
      'consult-log':{need:'m',req:'baek-paper',early2:'상담 일지라. 학을 접은 사람과 상담한 사람이 같다는 증거라도 있나?',reqHint:'반장님은 아직 종이학 자체를 부인하고 있어요. 그 종이부터 증명해요.',brk:'baek-strangers',a:'강도윤, 오세창, 이세린, 모모. …그래, 다들 내 상담실에 왔었지. 누군가를 고발할지 고민하면서. 나는 그 고민을 반대편에 흘려줬을 뿐이네.'},
      'crane-4':{need:'h',req:'baek-strangers',early2:'넷째 학이 왜? 내용이 좀 다르긴 하지.',reqHint:'아직 반장님이 피해자들을 만난 것부터 부인하고 있어요.',brk:'baek-hands',gain:'creed',a:'…넷째는 정보가 아니었지. "사라지는 건 물건뿐이다." 그래, 그 아이에게 살인 대신 도둑질을 골라 줬네. 나는 밀기만 한 게 아니라, 결과를 고르고 있었어. 인정하지.'},
      scrapbook:{need:'h',req:'baek-strangers',early2:'신문 스크랩은 늙은이 취미일세.',reqHint:'아직 피해자들을 만난 것부터 부인하고 있어요.',a:'범인 이름에 동그라미… 관찰 기록이지. 하지만 관찰은 죄가 아니네. 손을 댄 증거를 가져오게.'},
      'crane-5-note':{need:'y',req:'baek-hands',brk:'baek-player',a:'…그래. 자네를 특수심문반에 추천한 건 나네. 넷째 사건에서 아무도 죽지 않게 한 것도, 자네를 시험하는 중이었기 때문이지. 자네는 합격이야. …서아야, 미안하다.'},
      badge:{ex:'normal',a:'그건 서아가 지난 설에 인사 왔다가 두고 간 거네. 이름 가린 건 서아 장난이고. 현직 중에 학이 있을 거라 생각했나? 아니야. (한서아: …네, 제 거예요. 설에 인사드리러 왔다가 두고 갔어요.)'},
      'crane-5':{a:'아직 펼치지 않았군. 그건 서아 거야. 때가 되면 서아가 펼칠 거네.'},
      'crane-1':{a:'박정호. 장부를 태울 줄 알았는데, 사람을 죽이더군. 나도 놀랐네.'},
      'crane-2':{a:'박성호. "법적으로"를 입에 달고 살던 사람이지. 등을 미니 바로 넘어지더군.'},
      'crane-3':{a:'강민재. 기술로 알리바이를 만들 줄은 몰랐네. 똑똑한 사람일수록 깊이 떨어지지.'}}}
},
pl:{'baek-paper':'반장님이 접었어요… 학교 다닐 때, 학 하나 못 접는다고 제가 놀렸는데. 그것도 연기였어요.',
  'baek-strangers':'피해자들이 반장님한테 고민을 털어놨던 거예요. 그 고민을 반대편에… 흘린 거고요.',
  'baek-hands':'"결과를 골랐다"고 했어요, 선배. 손을 안 댄 게 아니에요. 손 대신 사람을 쓴 거예요.',
  'baek-player':'…선배를 추천한 게 반장님이었다니. 저, 지금 무슨 표정인지 모르겠어요.'},

  [(st)=>st.shown.baekbadge,'현관 출입증은 서아가 설에 두고 간 것(백도겸의 말, 서아도 확인). 현직 내부자 가설은 근거가 약하다.'],
  [(st)=>st.flags['baek-paper'],'백도겸은 종이학을 접은 걸 인정했다. 손재주가 없다는 건 거짓말이었다.'],
  [(st,has)=>has('consult-log'),'네 피해자 모두 지난 1년 사이 백도겸의 무료 상담을 받았다.'],
  [(st)=>st.flags['baek-strangers'],'피해자들의 고민(고발 여부)을 반대편 사람에게 흘렸다.'],
  [(st,has)=>has('creed'),'"사람은 등을 떠밀릴 때 본성을 드러낸다." 넷째 사건은 결과까지 골랐다.'],
  [(st,has)=>has('crane-5-note'),'다섯 번째 쪽지: 선배를 특수심문반에 추천한 건 백도겸.']],
hints:[[(st)=>!st.asked.baekp,'먼저 종이학을 반장님이 접었는지 물어봐요. 부인하실 거예요. 그게 시작이에요.'],
  [(st,has)=>!has('old-forms'),'반장님은 예의 바른 사람한테 너그러워요. 정중하게 물어서 신뢰를 쌓고, 서재를 둘러보게 해 달라고 해요.'],
  [(st)=>!st.flags['baek-paper'],'종이학과 같은 <em>옛 조서 용지</em>가 서재에 있었어요. 들이밀어요.'],
  [(st,has)=>!has('consult-log'),'은퇴 후에 뭘 하셨는지 물어봐요. 그리고 그 기록을요.'],
  [(st)=>!st.flags['baek-strangers'],'관계자를 만난 적 없다고 하시면… <em>상담 일지</em>에 이름이 넷 있어요.'],
  [(st)=>!st.flags['baek-hands'],'"선택은 그들이 했다"고요? 넷째 학만 달랐어요. <em>네 번째 종이학</em>을 보여 드려요.'],
  [(st,has)=>!has('crane-5-note'),'다섯 번째 학이요. …제가 펼칠게요. 펼쳐도 되냐고 물어봐 주세요.'],
  [(st)=>!st.flags['baek-player'],'왜 선배를 불렀는지 물어보고, <em>다섯 번째 쪽지</em>를 보여 드려요.']],
boardLine:'선배, 이번 보드는 학의 정체와 방법이에요. 반장님 논리를 증거로 하나씩 못 박아요.',
board:{tl:[{id:'t1',time:'종이',q:'종이학을 접은 종이',opts:['7년 전 폐기된 조서 용지','편의점 색종이','신문지'],ans:0,ev:['old-forms','invite'],ph:'무엇?'},
  {id:'t2',time:'출처',q:'학이 비밀을 얻은 곳',opts:['경찰 기록 무단 열람','피해자들의 무료 상담','도청'],ans:1,ev:['consult-log'],ph:'어디?'},
  {id:'t3',time:'#004',q:'넷째 사건에서만 아무도 죽지 않은 이유',opts:['학이 마음을 바꿔서','선배를 시험하던 중이라 결과를 골랐다','범인이 겁을 먹어서'],ans:1,ev:['crane-5-note','crane-4'],ph:'왜?'}],
 ded:[{id:'c',time:'학',q:'종이학을 보낸 사람',opts:['백도겸','현직 특수심문반 누군가','범인들끼리의 공모'],ans:0,ev:['old-forms','consult-log'],ph:'정체'},
  {id:'m',time:'동기',q:'학이 그런 짓을 한 이유',opts:['옛 사건의 복수','등 떠밀린 사람의 본성을 보고 싶어서','돈'],ans:1,ev:['creed','scrapbook'],ph:'동기'},
  {id:'w',time:'방법',q:'학의 방법',opts:['직접 살해','벼랑 끝의 사람에게 비밀을 흘려 등을 떠밀었다','협박해서 시켰다'],ans:1,ev:['consult-log','creed','crane-4'],ph:'방법'}]},
resLines:{S:'선배… 끝났어요. 반장님 논리, 하나도 안 남기고 무너뜨렸어요. …고마워요.',A:'학은 잡았어요. 근거 몇 개만 더 있었으면 완벽했을 텐데.',B:'반장님이 웃고 계셨어요. 아직 다 못 무너뜨린 거예요.',C:'…반장님 말대로 됐어요. 우리가 놓쳤어요.'},
truth:'<p>"학"은 특수심문반 초대 반장 백도겸. 은퇴 후 주민센터에서 무료 생활 상담을 하며, 누군가를 고발할지 고민하던 피해자들의 이야기를 들었다. 그리고 그 비밀을 7년 전 조서 용지로 접은 종이학에 적어, 벼랑 끝에 선 반대편 사람에게 흘렸다.</p><p>그는 "손대지 않았다"고 했지만, 넷째 사건에서는 살인 대신 도난을 골라 줄 만큼 결과를 설계하고 있었다. 플레이어를 특수심문반에 추천한 것도, 넷째 사건에서 결과를 골라 플레이어를 시험한 것도 그였다.</p>',
inter:{lines:[['baek','잘했네. 서아, 네 선배는 내가 본 중에 제일 좋은 형사야.'],'…반장님. 왜 저한테 쓰셨어요. 왜 하필 저한테.',['baek','네가 이 사람 옆에 있어야 했으니까. 그게 내 마지막 학이었어.'],['baek','하나만 더 알려 주지. 나한테 종이학 접는 법을 가르친 사람이… 따로 있어.'],'선배, 방금… 무슨 뜻이에요?'],ex:['normal','tense','normal','normal','tense'],
  final:()=>`<div class="note-card enter">${crane(true)}<small>시즌 1 종결</small>나한테 종이학 접는 법을 가르친 사람이 따로 있어.</div><div class="unlock"><span>시즌 1 클리어</span><span>시즌 2 「접힌 날개」 준비 중</span></div>`},
files:{baek:'특수심문반 초대 반장. "사람은 등을 떠밀릴 때 본성을 드러낸다"고 믿었다. 은퇴 후 상담 봉사로 비밀을 모아, 네 사람의 등을 떠밀었다. 플레이어를 추천하고 시험한 것도 그였다. 그에게 학 접는 법을 가르친 사람은 따로 있다.'}
};


/* ===== 시즌 ===== */
let SAVE={grades:{},cranes:[]},pendingInter=null;
try{const v=JSON.parse(localStorage.getItem('sim-s1')||'null');if(v&&v.grades)SAVE=v}catch(e){}
const store=()=>{try{localStorage.setItem('sim-s1',JSON.stringify(SAVE))}catch(e){}};
const crane=on=>`<svg viewBox="0 0 16 12" shape-rendering="crispEdges" aria-hidden="true"><polygon points="0,7 6,5 8,0 9,5 16,3 10,8 11,10 5,9" fill="${on?'#f4ecd8':'#2c3438'}"/><polygon points="6,5 8,0 9,5 8,7" fill="${on?'#d8ccb1':'#252c30'}"/><rect x="11" y="9" width="2" height="1" fill="${on?'#d23c3c':'#252c30'}"/></svg>`;
const SEASON=['case-001','case-002','case-003','case-004','case-005'].filter(id=>CASES[id]);
const SLINE=n=>SAVE.ended?'시즌 1 종결. …선배, 반장님이 남긴 마지막 학, 아직 제 책상 서랍에 있어요.':n===0?'선배, 첫 사건이에요. 바닷가 펜션에서 사람이 죽었대요. 같이 가요!':n<4?`종이학이 ${n}개째예요. 같은 종이로 접혀 있어요… 누가 범인들한테 비밀을 흘리고 있어요.`:'종이학을 다 모았어요. 반장실 책상 위에 다섯 번째가 놓여 있었어요, 선배.';
const isOpen=c=>!c.finale||SAVE.cranes.length>=4;
function openSeason(){st=null;
  const n=SAVE.cranes.length;
  $('#cranes').innerHTML=[0,1,2,3].map(i=>crane(i<n)).join('')+`<span class="lbl">${n}/4</span>`;
  $('#seasonPtn').innerHTML=sil('seoa',n&&!SAVE.ended?'tense':'normal')+`<p><b>${PT.name}</b>${SLINE(n)}</p>`;
  $('#cases').innerHTML=SEASON.map(id=>{const c=CASES[id],g=SAVE.grades[id],locked=!isOpen(c);
    return `<button class="case px ${locked?'locked':''} ${c.finale?'finale':''}" data-case="${id}" ${locked?'aria-disabled="true"':''}><span class="no">No.${c.no}</span><div><b>${c.title}</b><span>${c.sub}</span></div>${g?`<span class="gr">${g}</span>`:`<span class="st">${locked?'종이학 4개 필요':'수사 시작 ›'}</span>`}</button>`}).join('');
  show('#season')}
document.getElementById('cases').addEventListener('click',e=>{const b=e.target.closest('.case');if(!b||b.classList.contains('locked'))return;audio();SFX.click();openIntro(b.dataset.case)});
/* ===== 막간 ===== */
function openInter(id){const d=CASES[id].inter;let i=0;const stage=$('#interStage');$('#interDone').hidden=true;$('#interHint').hidden=false;
  const step=()=>{if(i<d.lines.length){const ln=d.lines[i],who=Array.isArray(ln)?ln[0]:'seoa',t=Array.isArray(ln)?ln[1]:ln;
      stage.insertAdjacentHTML('beforeend',who==='seoa'?ptn(t,d.ex&&d.ex[i]||'normal'):who==='note'?`<div class="note-card enter">${t}</div>`:`<div class="ptn spk px">${sil(who,'normal')}<p><b>${nm(who)}</b>${t}</p></div>`);SFX.blip(who==='note'?'seoa':who);i++;try{stage.lastElementChild.scrollIntoView({block:'nearest'})}catch(e){}}
    else if(i===d.lines.length){stage.insertAdjacentHTML('beforeend',d.final?d.final():`<div class="note-card enter">${crane(true)}<small>종이학 속 쪽지 · ${d.where}</small>${d.note}</div><div class="unlock"><span>종이학 ${SAVE.cranes.length}/4 획득</span><span>캐릭터 파일 해금</span></div>`);SFX.gain();buzz(30);i++;$('#interDone').hidden=false;$('#interHint').hidden=true;try{stage.lastElementChild.scrollIntoView({block:'nearest'})}catch(e){}}};
  stage.innerHTML='';stage.onclick=step;step();show('#inter')}
$('#interDone').onclick=()=>openSeason();
/* ===== 캐릭터 파일 ===== */
function openFiles(){const list=SEASON.filter(id=>SAVE.cranes.includes(id)||(CASES[id].finale&&SAVE.ended));
  $('#fileList').innerHTML=list.length?list.map(id=>{const c=CASES[id];Object.entries(c.sus).forEach(([k,v])=>LOOK[k]=Object.assign({pitch:500},v.look));
    return `<div class="fcase"><h2>#${c.no} ${c.title}</h2>${Object.entries(c.files).map(([k,t])=>`<div class="fcard px">${sil(k,k===c.culprit?'tense':'normal')}<div><b>${c.sus[k].name}${k===c.culprit?'<em>범인</em>':''}</b><p>${t}</p></div></div>`).join('')}</div>`}).join(''):'<p>아직 해결한 사건이 없어요. 사건을 해결하면 용의자들의 진짜 사정이 이곳에 기록돼요.</p>';
  if(C)loadCase(C.id);show('#files')}
sndIcon();
{const P=k=>PORTRAITS[k]&&PORTRAITS[k].normal;const cast=['jeong','sera','seoa','jihu','han'].filter(P);
  $('#titleCast').innerHTML=cast.map(k=>`<img src="${P(k)}" alt="" class="${k==='seoa'?'lead':''}">`).join('')}
openSeason();show('#title');$('#title').onclick=()=>openSeason();
}

</script>
